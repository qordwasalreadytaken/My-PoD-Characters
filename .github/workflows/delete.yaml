name: Delete Character
run-name: Delete character ${{ inputs.character }}

on:
  workflow_dispatch:
    inputs:
      character:
        description: |
          Character to delete.
          Case doesn't matter.

          WARNING:
          This permanently deletes every snapshot
          and removes the character from the watchlist.
          This cannot be undone.
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Delete character
        run: |
          python delete.py \
            --character "${{ github.event.inputs.character }}"

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi

          git add -A
          git commit -m "Delete ${{ github.event.inputs.character }}"
          git push