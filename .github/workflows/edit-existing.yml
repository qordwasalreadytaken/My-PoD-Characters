name: Edit Existing Snapshot
run-name: Edit snapshot for ${{ inputs.character }}

on:
  workflow_dispatch:
    inputs:
      character:
        description: "Character name"
        required: true
        type: string

      snapshot:
        description: "Snapshot key to edit (available in the Notes section of a snapshot)"
        required: true
        type: string

      key:
        description: "New snapshot key (leave blank to keep)"
        required: false
        type: string

      title:
        description: "New title (leave blank to keep)"
        required: false
        type: string

      description:
        description: "New description (leave blank to keep)"
        required: false
        type: string

      journal:
        description: "New journal (use \\n for line breaks, leave blank to keep)"
        required: false
        type: string

      tags:
        description: "New tags comma separated (leave blank to keep)"
        required: false
        type: string

      favorite:
        description: |
          Favorite
          Marks this milestone with a ★ on the archive page
        required: true
        type: choice
        options:
          - Leave
          - Yes
          - No

      story:
        description: "Story navigation"
        required: true
        type: choice
        options:
          - Leave
          - Yes
          - No

      guide:
        description: "New url for build guide (leave blank to keep)"
        required: false
        type: string

      clear_guide:
        description: "Remove existing build guide URL"
        required: false
        type: boolean

permissions:
  contents: write


jobs:
  edit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Edit existing snapshot
        env:
          CHARACTER: ${{ github.event.inputs.character }}
          SNAPSHOT: ${{ github.event.inputs.snapshot }}
          KEY: ${{ github.event.inputs.key }}
          TITLE: ${{ github.event.inputs.title }}
          DESCRIPTION: ${{ github.event.inputs.description }}
          JOURNAL: ${{ github.event.inputs.journal }}
          TAGS: ${{ github.event.inputs.tags }}
          FAVORITE: ${{ github.event.inputs.favorite }}
          STORY: ${{ github.event.inputs.story }}
          GUIDE: ${{ github.event.inputs.guide }}
          CLEAR_GUIDE: ${{ github.event.inputs.clear_guide }}
        run: |
          python edit_snapshot.py \
            --character "$CHARACTER" \
            --snapshot "$SNAPSHOT" \
            --key "$KEY" \
            --title "$TITLE" \
            --description "$DESCRIPTION" \
            --journal "$JOURNAL" \
            --tags "$TAGS" \
            --favorite "$FAVORITE" \
            --story "$STORY" \
            --guide "$GUIDE" \
            --clear-guide "$CLEAR_GUIDE"
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi

          git add -A
          git commit -m "Edit snapshot ${{ github.event.inputs.snapshot }} for ${{ github.event.inputs.character }}"
          git push