name: Create Milestone Snapshot
run-name: Add milestone for ${{ inputs.character }}

on:
  workflow_dispatch:
    inputs:
      character:
        description: |
          Character name to snapshot.
          Case doesn't matter.
        required: true
        type: string
      title:
        description: Optional milestone title.
        required: false
        type: string
      description:
        description: |
          Optional milestone description.
          Short description shown on the archive page.
        required: false
        type: string
      journal:
        description: |
          Optional longer journal text.
          Supports multiple lines with \\n for line breaks.
        required: false
        type: string
      tags:
        description: |
          Optional comma-separated tags.
          Class tags (sorc, barb, etc.) are automatically added.
          Example: ssfhc, season15
        required: false
        type: string
      slug:
        description: |
          Optional Snapshot Key.
          Used in share links/url's.
          Example: first-uber-clear, Level20, etc.
        required: false
        type: string
      story:
        description: |
          Include this milestone in the Story timeline.
        required: false
        default: false
        type: boolean
      favorite:
        description: |
          Mark as favorite
          Marks this milestone with a ★ on the archive page
          Marking just one snapshot as favorite will include a character in favorites
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  snapshot-single:
    runs-on: ubuntu-latest
    concurrency:
      group: snapshot-single-character-${{ github.event.inputs.character }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Snapshot selected character with metadata
        env:
          CHARACTER: ${{ inputs.character }}
          TITLE: ${{ inputs.title }}
          DESCRIPTION: ${{ inputs.description }}
          JOURNAL: ${{ inputs.journal }}
          TAGS: ${{ inputs.tags }}
          SLUG: ${{ inputs.slug }}
          STORY: ${{ inputs.story }}
          FAVORITE: ${{ inputs.favorite }}
        run: |
          python manual_snapshot.py \
            --character "$CHARACTER" \
            --title "$TITLE" \
            --description "$DESCRIPTION" \
            --journal "$JOURNAL" \
            --tags "$TAGS" \
            --slug "$SLUG" \
            --story "$STORY" \
            --favorite "$FAVORITE"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots index.json
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "chore: snapshot ${{ inputs.character }}"
          git push
